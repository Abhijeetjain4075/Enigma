[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "enigma-transaction-lab"
version = "0.1.0"
description = "A simulator-only, evidence-oriented transaction orchestration laboratory."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.142,<1",
  "uvicorn[standard]>=0.32,<1",
  "SQLAlchemy>=2.0.36,<3",
  "alembic>=1.14,<2",
  "psycopg[binary]>=3.2,<4",
]

[project.optional-dependencies]
test = ["pytest>=9.0.3,<10", "httpx>=0.27,<1", "pytest-cov>=6,<8"]
security = ["pip-audit>=2.7,<3", "bandit>=1.7,<2"]
quality = ["ruff>=0.9,<1", "mypy>=1.14,<2"]

[tool.setuptools.packages.find]
include = ["enigma*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.coverage.run]
branch = true
source = ["enigma"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]
ignore = ["S101"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
ignore_missing_imports = true
warn_unused_ignores = true
no_implicit_optional = true
